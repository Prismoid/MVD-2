name: user-connector

services:
  api:
    build: .
    ports:
      - "7550:7550"
    volumes:
      - ./certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build: .
    command: python gateway.py
    ports:
      - "7553:7553"
    volumes:
      - ./certs:/certs:ro
    environment:
      PKR_URL: "http://host.docker.internal:7450"
      BACKEND_URL: "http://api:7550"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api